<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kevedit</title>
<!-- kev(QNX のカーネルトレース)を 1 スロットずつ編集する。定義は下の <script id="defs"> に埋め込んである(kevcsv.py の DEFS と同じ内容) -->
<style>
  :root {
    --bg: #fafafa; --fg: #1d1d1f; --muted: #6b6b70; --line: #d9d9de; --head: #eef0f3;
    --accent: #2f6fdf; --bad: #c62828; --badbg: #fdecea; --warn: #8a5a00; --warnbg: #fff6dc;
    --off: #9a9aa0; --input: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1c1f; --fg: #e6e6e9; --muted: #9a9aa3; --line: #3a3b40; --head: #26282c;
      --accent: #6c9dff; --bad: #ff6b6b; --badbg: #3a1f1f; --warn: #ffcc66; --warnbg: #352c17;
      --off: #6b6b72; --input: #232428;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.45 system-ui, "Segoe UI", "Yu Gothic UI", sans-serif; }
  header.bar { position: sticky; top: 0; z-index: 3; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    padding: 8px 16px; background: var(--head); border-bottom: 1px solid var(--line); }
  header.bar h1 { font-size: 15px; margin: 0 12px 0 0; }
  main { padding: 8px 16px 40px; }
  h2 { font-size: 14px; margin: 18px 0 6px; }
  button { font: inherit; padding: 3px 10px; border: 1px solid var(--line); border-radius: 4px; background: var(--input); color: var(--fg); cursor: pointer; }
  button:hover { border-color: var(--accent); }
  input, select { font: inherit; color: var(--fg); background: var(--input); border: 1px solid var(--line); border-radius: 3px; padding: 1px 4px; }
  input.bad { border-color: var(--bad); background: var(--badbg); }
  .mono, input.mono { font-family: ui-monospace, Consolas, "Cascadia Mono", monospace; }
  .muted { color: var(--muted); }
  .sep { width: 1px; align-self: stretch; background: var(--line); margin: 0 4px; }
  #msgs { margin: 8px 0; }
  #msgs div { padding: 3px 8px; margin: 2px 0; border-radius: 3px; }
  #msgs .err { color: var(--bad); background: var(--badbg); }
  #msgs .warn { color: var(--warn); background: var(--warnbg); }
  #msgs .info { color: var(--muted); }
  table { border-collapse: collapse; }
  th, td { border-bottom: 1px solid var(--line); padding: 2px 4px; white-space: nowrap; vertical-align: middle; }
  th { background: var(--head); font-weight: 600; text-align: left; position: sticky; top: 0; z-index: 2; }
  tr.off td { color: var(--off); }
  tr.off input, tr.off select { opacity: .55; }
  td.n { text-align: right; color: var(--muted); }
  .w3 { width: 3.2em; } .w4 { width: 4.6em; } .w10 { width: 7.6em; } .w12 { width: 9em; } .w20 { width: 16em; } .w40 { width: 32em; }
  select.cls { width: 7.5em; } select.ev { width: 13em; }
  .stack { display: flex; flex-direction: column; gap: 2px; align-items: flex-start; }
  td.ops button { padding: 0 6px; margin-left: 2px; }
  .pager { display: flex; gap: 6px; align-items: center; margin: 6px 0; }
  .wrap { overflow: auto; max-height: 72vh; border: 1px solid var(--line); }
  .drop { outline: 3px dashed var(--accent); outline-offset: -6px; }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 4px 0 8px; }
  #bufInfo table { margin-top: 4px; }
  #bufInfo .wrap { max-height: 30vh; }
  #bufInfo tr.jump { cursor: pointer; }
  #bufInfo tr.jump:hover td { background: var(--head); }
  #bufInfo td.bad { color: var(--warn); }
  tr.hit td { animation: hit 1.6s ease-out; }
  @keyframes hit { from { background: var(--warnbg); } to { background: transparent; } }
</style>
</head>
<body>
<header class="bar">
  <h1>kevedit</h1>
  <button id="bOpen" title="kev または CSV(拡張子 .csv)を開く。ページにファイルを落としても開けます">開く</button>
  <button id="bNew">新規</button>
  <span class="sep"></span>
  <label>名前 <input id="fname" class="w20" value="edited"></label>
  <button id="bSaveKev">kev を保存</button>
  <button id="bSaveCsv">CSV を保存</button>
  <span class="sep"></span>
  <span id="summary" class="muted"></span>
  <input id="file" type="file" accept=".kev,.csv,*/*" hidden>
</header>
<main>
  <div id="msgs"></div>

  <h2>ヘッダ</h2>
  <div class="wrap"><table id="hdr">
    <thead><tr><th>#</th><th>有効</th><th>キー(区切りの <span class="mono">::</span> を含む)</th><th>値</th><th></th></tr></thead>
    <tbody></tbody>
  </table></div>
  <p><button id="bHdrAdd">項目を追加</button> <span id="hdrInfo" class="muted"></span></p>

  <h2>syspage</h2>
  <p id="sys"></p>

  <h2>トレースバッファ</h2>
  <div class="tools">
    <button id="bAddBuf" title="スロットの末尾(新規の空行より前)に TIME・BUFFER・BUFFER_END の 3 行を足す。CPU と時刻は直前の有効なスロットから">トレースバッファ追加</button>
    <button id="bFix" title="BUFFER_END で閉じたトレースバッファの、BUFFER のスロット数を実際の数(TIME から BUFFER_END まで)にする">バッファ内スロット数修正</button>
  </div>
  <div id="bufInfo"></div>

  <h2>スロット</h2>
  <div class="pager" id="pagerTop"></div>
  <div class="wrap"><table id="slots">
    <thead><tr>
      <th>#</th><th>有効</th>
      <th>header</th><th>stamp</th><th>payload[0]</th><th>payload[1]</th>
      <th>構造</th><th>CPU</th><th>フラグ</th>
      <th>クラス<br><span class="muted">名前 / 値</span></th><th>イベント<br><span class="muted">名前 / 値</span></th>
      <th>payload[0]<br><span class="muted">文字列 / 値(10 進)</span></th><th>payload[1]<br><span class="muted">文字列 / 値(10 進)</span></th><th></th>
    </tr></thead>
    <tbody></tbody>
  </table></div>
  <div class="pager" id="pagerBottom"></div>
  <p><button id="bAddRows"></button></p>
</main>

<script>
"use strict";
// ==== CORE BEGIN(画面に依存しない部分。tests/test_kevedit.mjs からも読む)

/** このツールの設定(数を変えるときはここだけ直す) */
const CONF = {
  newRows: 100,              // 新規作成時のスロット行数
  addRows: 100,              // 「行を追加」で足す行数
  pageSize: 500,             // 1 ページに表示するスロット行数
  maxSlots: 200000,          // 読み込むスロットの上限(超えた分は読まない)
  headerScanBytes: 16 << 20, // ヘッダの終わりを探す範囲
  strBytes: 8,               // payload 2 語の文字列のバイト数(payload[0] の文字列欄はここまで入り、4 バイトを超えた分は payload[1] へ)
  wordBytes: 4,              // payload 1 語の文字列のバイト数
  csv: {
    on: "on", off: "off",
    sections: { header: "[header]", syspage: "[syspage]", slots: "[slots]" },
    headerCols: ["key", "value"], // kev のヘッダ = 有効な行の key + value をつないだもの(key は区切りを含む)
    syspageCols: ["offset", "bytes"],
    syspageRowBytes: 16,
    slotCols: ["header", "stamp", "payload0", "payload1"], // 読み込むのはこの 4 列(スロットの 4 語)
    slotInfoCols: [                                          // 参考。読み込みでは使わない
      "(struct)", "(cpu)", "(flags)", "(class_name)", "(class)", "(event_name)", "(event)",
      "(payload0_str)", "(payload0_dec)", "(payload1_str)", "(payload1_dec)",
    ],
  },
  // トレースバッファの補助
  bufferSlots: 1011,         // 1 トレースバッファのスロット数の上限(_TRACELEMENTS。QNX 8.0 の値)
  bufferSeqStart: 1,         // その CPU に BUFFER が無いときの通番
  maxBufferRows: 300,        // トレースバッファの一覧に出す行数
};

function makeCore(D) {
  const L = D.layout;
  const FIELDS = ["struct", "cpu", "class", "event", "flags"];
  const u32 = (x) => x >>> 0;
  const fmask = (f) => u32(L[f].mask << L[f].shift);
  const FIELD_MASK = FIELDS.reduce((a, f) => u32(a | fmask(f)), 0);
  const REST_MASK = u32(~FIELD_MASK);
  const H = D.header;
  const SB = D.slot_bytes;

  // ---- ヘッダ語のフィールド
  function getF(h, f) { return (h >>> L[f].shift) & L[f].mask; }
  function setF(h, f, v) { return u32((h & ~fmask(f)) | ((v & L[f].mask) << L[f].shift)); }
  function rest(h) { return u32(h & REST_MASK); }

  // ---- 名前
  const structByVal = new Map(D.structs.map(([v, n]) => [v, n]));
  const classByVal = new Map();
  for (const c of D.classes) { c.byVal = new Map(c.events.map(([v, n]) => [v, n])); classByVal.set(c.value, c); }
  function structName(v) { return structByVal.get(v) ?? null; }
  function className(v) { const c = classByVal.get(v); return c ? c.name : null; }
  function eventName(cv, ev) {
    const c = classByVal.get(cv);
    if (!c) return null;
    let n = c.byVal.get(ev);
    if (n) return n;
    if (c.bit64 && (ev & c.bit64)) { n = c.byVal.get(ev & ~c.bit64); if (n) return n + ":64"; }
    return null;
  }

  // ---- 数値
  /** u32 を読む。10 進、0x 付き 16 進、負の 10 進(2 の補数)。hex = true なら 0x が無くても 16 進 */
  function parseU32(s, hex = false) {
    s = String(s).trim().replace(/_/g, "");
    let v;
    if (/^0x[0-9a-f]+$/i.test(s)) v = parseInt(s.slice(2), 16);
    else if (hex && /^[0-9a-f]+$/i.test(s)) v = parseInt(s, 16);
    else if (/^-?\d+$/.test(s)) v = Number(s);
    else throw new Error(`数値ではありません: "${s}"`);
    if (v < -0x80000000 || v > 0xffffffff) throw new Error(`32 ビットに収まりません: ${s}`);
    return u32(v);
  }
  function parseField(s, f, hex = false) {
    const v = parseU32(s, hex);
    if (v > L[f].mask) throw new Error(`${f} は 0〜${L[f].mask} です: ${s}`);
    return v;
  }
  const hex8 = (v) => "0x" + u32(v).toString(16).padStart(8, "0");
  const hex2 = (v) => "0x" + v.toString(16).padStart(2, "0");

  // ---- 文字列(payload 2 語のバイト列。バイト順はファイルのもの)
  function wordsToBytes(d1, d2, le) {
    const b = new Uint8Array(8), v = new DataView(b.buffer);
    v.setUint32(0, d1, le); v.setUint32(4, d2, le);
    return b;
  }
  function bytesToWords(b, le) {
    const p = new Uint8Array(8); p.set(b.subarray(0, 8));
    const v = new DataView(p.buffer);
    return [v.getUint32(0, le), v.getUint32(4, le)];
  }
  function wordsToStr(d1, d2, le) { return bytesToStr(wordsToBytes(d1, d2, le)); }
  function wordToStr(d, le) { return bytesToStr(wordsToBytes(d, 0, le).subarray(0, 4)); }
  function strToWords(s, le) { return bytesToWords(strToBytes(s, CONF.strBytes), le); }
  /** 末尾の NUL は省く。表示できないバイトと \ は \xHH / \\ で書く */
  function bytesToStr(b) {
    let n = b.length;
    while (n > 0 && b[n - 1] === 0) n--;
    let s = "";
    for (let i = 0; i < n; i++) {
      const c = b[i];
      if (c === 0x5c) s += "\\\\";
      else if (c >= 0x20 && c < 0x7f) s += String.fromCharCode(c);
      else s += "\\x" + c.toString(16).padStart(2, "0");
    }
    return s;
  }
  /** 文字列 → バイト列(max バイトまで) */
  function strToBytes(s, max) {
    const out = [];
    for (let i = 0; i < s.length; i++) {
      const ch = s[i];
      if (ch === "\\") {
        if (s[i + 1] === "\\") { out.push(0x5c); i++; continue; }
        const m = /^x([0-9a-fA-F]{2})/.exec(s.slice(i + 1));
        if (!m) throw new Error(`\\ の後は \\\\ か \\xHH です`);
        out.push(parseInt(m[1], 16)); i += 3; continue;
      }
      const c = ch.charCodeAt(0);
      if (c > 0xff) throw new Error(`latin-1 の範囲外の文字です: ${ch}`);
      out.push(c);
    }
    if (out.length > max) throw new Error(`${max} バイトを超えています(${out.length} バイト)`);
    return Uint8Array.from(out);
  }

  // ---- 文書
  // ヘッダの行 = { on, key, value }。key は区切りまで含む(例: "TRACE_VER_MAJOR::")。
  // kev のヘッダは有効な行の key + value をそのままつないだ文字列。
  // 意味(エンディアン、SYSPAGE_LEN など)は、つないだ文字列を kev と同じ規則で読み直して決める。
  function newSlot(fresh = false) { return { on: !fresh, fresh, h: 0, stamp: 0, d1: 0, d2: 0 }; }
  function newHeaderRow() { return { on: true, key: "", value: "" }; } // 空の行は何も出さない
  function newDoc() {
    return {
      header: D.new_header.map(([key, value]) => ({ on: true, key: key + H.postfix, value })),
      syspage: [],
      slots: Array.from({ length: CONF.newRows }, () => newSlot(true)),
      notes: [],
    };
  }
  function headerText(header) { return header.filter((x) => x.on).map((x) => x.key + x.value).join(""); }
  const keyRe = () => new RegExp(reEsc(H.prefix) + "[A-Z0-9_]+" + reEsc(H.postfix), "g");
  /** ヘッダの文字列を項目に分ける(HEADER_END まで)。end = HEADER_END の直後の位置(無ければ -1) */
  function splitHeader(text) {
    const re = keyRe(), keys = [];
    let end = -1, m;
    while ((m = re.exec(text))) {
      const key = m[0].slice(0, m[0].length - H.postfix.length);
      keys.push({ key, start: m.index, vstart: m.index + m[0].length });
      if (key === H.end) { end = m.index + m[0].length; break; }
    }
    const items = keys.map((k, i) => ({ key: k.key, start: k.start, value: text.slice(k.vstart, i + 1 < keys.length ? keys[i + 1].start : k.vstart) }));
    return { items, end };
  }
  /** ヘッダから読む値(同じキーが複数なら最後。無ければ null) */
  function headerValue(header, key) {
    let v = null;
    for (const x of splitHeader(headerText(header)).items) if (x.key === key) v = x.value;
    return v;
  }
  /** LITTLE_ENDIAN があればリトル、無くて BIG_ENDIAN があればビッグ、どちらも無ければリトル */
  function littleEndian(header) {
    if (headerValue(header, H.little_endian) !== null) return true;
    if (headerValue(header, H.big_endian) !== null) return false;
    return true;
  }
  function syspageLen(header) {
    const v = headerValue(header, H.syspage_len);
    if (v === null || v.trim() === "") return 0;
    if (!/^\s*\d+\s*$/.test(v)) return NaN;
    return Number(v);
  }

  function latin1(b, start, end) {
    let s = "";
    for (let i = start; i < end; i += 8192) s += String.fromCharCode.apply(null, b.subarray(i, Math.min(end, i + 8192)));
    return s;
  }
  const reEsc = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

  /** kev のバイト列 → 文書 */
  function parseKev(buf) {
    const notes = [];
    const text = latin1(buf, 0, Math.min(buf.length, CONF.headerScanBytes));
    const { items, end } = splitHeader(text);
    if (end < 0) throw new Error(`ヘッダの終わり(${H.end}${H.postfix})が見つかりません`);
    const header = items.map((x) => ({ on: true, key: x.key + H.postfix, value: x.value }));
    if (items[0].start > 0) { // 最初のキーより前のバイトも 1 行として持つ(書き出すと元に戻る)
      header.unshift({ on: true, key: "", value: text.slice(0, items[0].start) });
      notes.push(["warn", `ヘッダの最初のキーより前に ${items[0].start} バイトあります(1 行目)`]);
    }

    let sp = syspageLen(header);
    if (Number.isNaN(sp)) { notes.push(["warn", `${H.syspage_len} が数値ではないので 0 として読みます`]); sp = 0; }
    if (end + sp > buf.length) { notes.push(["warn", `syspage が ${sp - (buf.length - end)} バイト足りません`]); sp = buf.length - end; }
    const syspage = [];
    for (let o = 0; o < sp; o += CONF.csv.syspageRowBytes) {
      syspage.push({ on: true, bytes: buf.slice(end + o, end + Math.min(sp, o + CONF.csv.syspageRowBytes)) });
    }

    const base = end + sp;
    let n = Math.floor((buf.length - base) / SB);
    const tail = (buf.length - base) % SB;
    if (tail) notes.push(["warn", `末尾の ${tail} バイト(スロットに満たない端数)は読み込みません`]);
    if (n > CONF.maxSlots) {
      notes.push(["err", `スロットが ${n} 個あります。先頭の ${CONF.maxSlots} 個だけ読みました(保存すると残りは失われます)`]);
      n = CONF.maxSlots;
    }
    const le = littleEndian(header);
    const dv = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
    const slots = new Array(n);
    for (let i = 0; i < n; i++) {
      const o = base + i * SB;
      slots[i] = { on: true, fresh: false, h: dv.getUint32(o, le), stamp: dv.getUint32(o + 4, le), d1: dv.getUint32(o + 8, le), d2: dv.getUint32(o + 12, le) };
    }
    return { header, syspage, slots, notes };
  }

  /** 文書 → kev のバイト列(無効の行は出さない) */
  function buildKev(doc) {
    const hs = headerText(doc.header);
    for (let i = 0; i < hs.length; i++) {
      if (hs.charCodeAt(i) > 0xff) throw new Error(`ヘッダに latin-1 の範囲外の文字があります: ${hs[i]}`);
    }
    const sys = doc.syspage.filter((x) => x.on);
    const slots = doc.slots.filter((x) => x.on);
    const spLen = sys.reduce((a, x) => a + x.bytes.length, 0);
    const out = new Uint8Array(hs.length + spLen + slots.length * SB);
    for (let i = 0; i < hs.length; i++) out[i] = hs.charCodeAt(i);
    let o = hs.length;
    for (const x of sys) { out.set(x.bytes, o); o += x.bytes.length; }
    const le = littleEndian(doc.header);
    const dv = new DataView(out.buffer);
    for (const s of slots) {
      dv.setUint32(o, s.h, le); dv.setUint32(o + 4, s.stamp, le); dv.setUint32(o + 8, s.d1, le); dv.setUint32(o + 12, s.d2, le);
      o += SB;
    }
    return out;
  }

  /** 書き出す前に気づける点(保存は止めない) */
  function check(doc) {
    const out = [];
    const text = headerText(doc.header);
    const { items, end } = splitHeader(text);
    if (end < 0) out.push(["err", `ヘッダに ${H.end}${H.postfix} がありません(kev として読めません)`]);
    else if (end < text.length) out.push(["warn", `${H.end}${H.postfix} の後ろの ${text.length - end} 文字は syspage として読まれます`]);
    if (!items.length || items[0].key !== H.begin || items[0].start !== 0) out.push(["warn", `ヘッダが ${H.begin}${H.postfix} で始まっていません`]);
    for (const k of [H.ver_major, H.ver_minor]) {
      if (headerValue(doc.header, k) === null) out.push(["warn", `${k} がありません(traceprinter が読みません)`]);
    }
    const sp = syspageLen(doc.header);
    const actual = doc.syspage.filter((x) => x.on).reduce((a, x) => a + x.bytes.length, 0);
    if (Number.isNaN(sp)) out.push(["warn", `${H.syspage_len} が数値ではありません`]);
    else if (sp !== actual) out.push(["warn", `${H.syspage_len} は ${sp} ですが、出力する syspage は ${actual} バイトです`]);
    return out;
  }

  // ---- CSV
  const C = CONF.csv;
  function csvCell(s) {
    s = String(s);
    return /[",\r\n]|^\s|\s$/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
  function csvLine(cells) { return cells.map(csvCell).join(","); }
  function parseCsv(text) {
    const rows = [];
    let row = [], cell = "", q = false, line = 1, rowLine = 1;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) {
        if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
        else { if (c === "\n") line++; cell += c; }
      } else if (c === '"') q = true;
      else if (c === ",") { row.push(cell); cell = ""; }
      else if (c === "\n" || c === "\r") {
        if (c === "\r" && text[i + 1] === "\n") i++;
        row.push(cell); rows.push({ line: rowLine, cells: row }); row = []; cell = ""; line++; rowLine = line;
      } else cell += c;
    }
    if (cell !== "" || row.length) { row.push(cell); rows.push({ line: rowLine, cells: row }); }
    return rows;
  }

  /** 文書 → CSV(新規作成でまだ触っていない行は書かない) */
  function toCsv(doc) {
    const le = littleEndian(doc.header);
    const L2 = [];
    const flag = (x) => (x.on ? C.on : C.off);
    L2.push(csvLine([C.sections.header, ...C.headerCols]));
    for (const x of doc.header) L2.push(csvLine([flag(x), x.key, x.value]));
    L2.push(csvLine([C.sections.syspage, ...C.syspageCols]));
    let off = 0;
    for (const x of doc.syspage) {
      L2.push(csvLine([flag(x), off, "0x" + Array.from(x.bytes, (b) => b.toString(16).padStart(2, "0")).join("")]));
      off += x.bytes.length;
    }
    L2.push(csvLine([C.sections.slots, ...C.slotCols, ...C.slotInfoCols]));
    for (const s of doc.slots) {
      if (s.fresh) continue;
      const st = getF(s.h, "struct"), cv = getF(s.h, "class"), ev = getF(s.h, "event");
      L2.push(csvLine([
        flag(s), hex8(s.h), hex8(s.stamp), hex8(s.d1), hex8(s.d2),
        structName(st) ?? st, getF(s.h, "cpu"), hex2(getF(s.h, "flags")),
        className(cv) ?? "", cv, eventName(cv, ev) ?? "", ev,
        wordToStr(s.d1, le), s.d1, wordToStr(s.d2, le), s.d2,
      ]));
    }
    return L2.join("\r\n") + "\r\n";
  }

  /** CSV → 文書。誤りは行番号つきでまとめて投げる */
  function fromCsv(text) {
    if (text.charCodeAt(0) === 0xfeff) text = text.slice(1);
    const doc = { header: [], syspage: [], slots: [], notes: [] };
    const errs = [];
    const secByName = new Map(Object.entries(C.sections).map(([k, v]) => [v, k]));
    let sec = null;
    for (const { line, cells } of parseCsv(text)) {
      if (cells.every((c) => c.trim() === "")) continue;
      const kind = cells[0].trim();
      const cell = (i) => (i < cells.length ? cells[i] : "");
      try {
        if (kind.startsWith("[")) {
          sec = secByName.get(kind);
          if (!sec) throw new Error(`知らないセクションです: ${kind}`);
          continue;
        }
        const k = kind.toLowerCase();
        if (k !== C.on && k !== C.off) throw new Error(`1 列目は ${C.on} / ${C.off} / セクション名です: "${kind}"`);
        const on = k === C.on;
        if (!sec) throw new Error("セクション名の行より前にデータがあります");
        if (sec === "header") {
          doc.header.push({ on, key: cell(1), value: cell(2) }); // 前後の空白も文字として扱う
        } else if (sec === "syspage") {
          const hx = cell(2).trim().replace(/^0x/i, "").replace(/\s+/g, "");
          if (!/^([0-9a-f]{2})*$/i.test(hx)) throw new Error(`bytes は 16 進のバイト列です: ${cell(2)}`);
          doc.syspage.push({ on, bytes: Uint8Array.from(hx.match(/../g) ?? [], (x) => parseInt(x, 16)) });
        } else {
          const word = (i) => {
            if (cell(i).trim() === "") throw new Error(`${C.slotCols[i - 1]} が空です`);
            try { return parseU32(cell(i)); } catch (e) { throw new Error(`${C.slotCols[i - 1]}: ${e.message}`); }
          };
          doc.slots.push({ on, fresh: false, h: word(1), stamp: word(2), d1: word(3), d2: word(4) });
        }
      } catch (e) {
        errs.push(`${line} 行目: ${e.message}`);
      }
    }
    if (errs.length) {
      const more = errs.length > 20 ? `\n…ほか ${errs.length - 20} 件` : "";
      throw new Error("CSV を読めませんでした\n" + errs.slice(0, 20).join("\n") + more);
    }
    return doc;
  }

  // ---- トレースバッファ(TIME, BUFFER, イベント…, BUFFER_END)
  const CT = D.control, CW = CT.words;
  const isCtl = (s, e) => getF(s.h, "class") === CT.class && getF(s.h, "event") === e;
  const isFrame = (s) => isCtl(s, CT.time) || isCtl(s, CT.buffer) || isCtl(s, CT.buffer_end);
  const pv = (s, k) => (k === 0 ? s.d1 : s.d2); // payload の k 語目
  const pw = (pairs) => { const w = [0, 0]; for (const [k, v] of pairs) w[k] = u32(v); return w; };
  function ctlSlot(cpu, ev, stamp, w) {
    let h = setF(0, "cpu", cpu);
    h = setF(h, "class", CT.class);
    h = setF(h, "event", ev);
    return { on: true, fresh: false, h, stamp: u32(stamp), d1: w[0], d2: w[1] };
  }

  /** 有効なスロットをファイル順に見て、CPU ごとのトレースバッファと気づいた点を返す(行番号は 0 から) */
  function analyzeBuffers(slots) {
    const bufs = [], issues = [];
    const st = new Map();
    const get = (c) => {
      if (!st.has(c)) st.set(c, { open: null, lastSeq: null, prev: -1, pendingTime: -1, outside: [] });
      return st.get(c);
    };
    for (let i = 0; i < slots.length; i++) {
      const s = slots[i];
      if (!s.on) continue;
      const cpu = getF(s.h, "cpu"), c = get(cpu);
      for (const [oc, o] of st) {
        if (oc !== cpu && o.open && !o.open.interleaved) {
          o.open.interleaved = true;
          o.open.issues.push(`途中に CPU ${cpu} のスロットがある(${i + 1} 行)`);
        }
      }
      if (isCtl(s, CT.buffer)) {
        if (c.open) { c.open.issues.push("BUFFER_END が無いまま次の BUFFER"); bufs.push(c.open); }
        let first = i, actual = 1;
        if (c.pendingTime >= 0) { first = c.pendingTime; actual = 2; c.outside.pop(); } // 直前の TIME から数える
        const seq = pv(s, CW.buffer_sequence);
        const b = { cpu, seq, declared: pv(s, CW.buffer_num_events), first, row: i, last: i, actual, closed: false, issues: [], interleaved: false };
        if (c.lastSeq !== null && seq !== u32(c.lastSeq + 1)) b.issues.push(`通番が ${c.lastSeq} の次に ${seq}`);
        c.lastSeq = seq;
        c.open = b;
      } else if (c.open) {
        c.open.actual++;
        c.open.last = i;
        if (isCtl(s, CT.buffer_end)) {
          if (s.d1 !== D.cookie || s.d2 !== D.cookie) c.open.issues.push(`BUFFER_END の cookie が ${hex8(D.cookie)} ではない`);
          c.open.closed = true;
          bufs.push(c.open);
          c.open = null;
        }
      } else if (isCtl(s, CT.buffer_end)) {
        issues.push([i, `CPU ${cpu}: BUFFER の無い BUFFER_END(${i + 1} 行)`]);
      } else {
        c.outside.push(i);
      }
      c.pendingTime = !c.open && isCtl(s, CT.time) ? i : -1;
      c.prev = i;
    }
    for (const [cpu, c] of st) {
      if (c.open) { c.open.issues.push("BUFFER_END が無いまま終わる"); bufs.push(c.open); }
      if (c.outside.length) issues.push([c.outside[0], `CPU ${cpu}: トレースバッファの外のスロットが ${c.outside.length} 個(最初は ${c.outside[0] + 1} 行)`]);
    }
    for (const b of bufs) {
      if (b.closed && b.declared !== b.actual) b.issues.push(`スロット数が BUFFER では ${b.declared}、実際は ${b.actual}`);
      if (b.actual > CONF.bufferSlots) b.issues.push(`上限 ${CONF.bufferSlots} スロットを超えている`);
    }
    bufs.sort((a, b) => a.first - b.first);
    return { bufs, issues };
  }

  /** BUFFER_END で閉じたトレースバッファの BUFFER のスロット数を、実際の数に直す。直した数を返す */
  function fixBufferCounts(slots) {
    let n = 0;
    for (const b of analyzeBuffers(slots).bufs) {
      if (!b.closed || b.declared === b.actual) continue;
      const s = slots[b.row];
      if (CW.buffer_num_events === 0) s.d1 = b.actual; else s.d2 = b.actual;
      n++;
    }
    return n;
  }

  /**
   * スロットの末尾(新規の空行より前)に TIME・BUFFER・BUFFER_END の 3 行を足す。
   * CPU と stamp は直前の有効なスロットから(無ければ 0)。通番はその CPU の最後の BUFFER の次、
   * TIME の上位 32bit はその CPU の最後の TIME から。BUFFER のスロット数は 3(枠だけ)。
   * 足した位置(0 から)・CPU・通番を返す
   */
  function addBuffer(slots) {
    let at = slots.length;
    while (at > 0 && slots[at - 1].fresh) at--;
    let last = null;
    for (let i = at - 1; i >= 0 && !last; i--) if (slots[i].on) last = slots[i];
    const cpu = last ? getF(last.h, "cpu") : 0, stamp = last ? last.stamp : 0;
    let seq = CONF.bufferSeqStart, msb = 0;
    for (let i = 0; i < at; i++) {
      const s = slots[i];
      if (!s.on || getF(s.h, "cpu") !== cpu) continue;
      if (isCtl(s, CT.buffer)) seq = u32(pv(s, CW.buffer_sequence) + 1);
      if (isCtl(s, CT.time)) msb = pv(s, CW.time_msb);
    }
    slots.splice(at, 0,
      ctlSlot(cpu, CT.time, stamp, pw([[CW.time_msb, msb], [CW.time_lsb, stamp]])),
      ctlSlot(cpu, CT.buffer, stamp, pw([[CW.buffer_sequence, seq], [CW.buffer_num_events, 3]])),
      ctlSlot(cpu, CT.buffer_end, stamp, [D.cookie, D.cookie]));
    return { at, cpu, seq };
  }

  return {
    analyzeBuffers, fixBufferCounts, addBuffer, isFrame,
    D, L, getF, setF, rest, structName, className, eventName, classByVal,
    parseU32, parseField, hex8, hex2, wordsToStr, wordToStr, strToWords, strToBytes, bytesToWords,
    newSlot, newDoc, newHeaderRow, headerText, littleEndian, parseKev, buildKev, check, toCsv, fromCsv,
  };
}
// ==== CORE END

// ---------------------------------------------------------------- 画面
const K = makeCore(JSON.parse(document.getElementById("defs").textContent));
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

let doc = K.newDoc();
let page = 0;
let loadNotes = [];
let lastErr = null;
let opNote = null; // 直前の補助操作の結果

// ---- メッセージと集計
function renderMsgs() {
  const ana = K.analyzeBuffers(doc.slots);
  const nIss = ana.issues.length + ana.bufs.filter((b) => b.issues.length).length;
  const items = [
    ...(lastErr ? [["err", lastErr]] : []), ...loadNotes, ...(opNote ? [opNote] : []), ...K.check(doc),
    ...(nIss ? [["warn", `トレースバッファの注意が ${nIss} 件あります(「トレースバッファ」を参照)`]] : []),
  ];
  renderBuffers(ana);
  $("msgs").innerHTML = items.map(([k, m]) => `<div class="${k}">${esc(m).replace(/\n/g, "<br>")}</div>`).join("");
  const on = doc.slots.filter((s) => s.on).length;
  $("summary").textContent = `スロット ${doc.slots.length} 行(出力 ${on})・${K.littleEndian(doc.header) ? "リトル" : "ビッグ"}エンディアン・定義 QNX ${K.D.release}`;
}
function setErr(m) { lastErr = m; renderMsgs(); }

// ---- ヘッダ
function renderHeader() {
  $("hdr").tBodies[0].innerHTML = doc.header.map((x, i) => `
    <tr data-i="${i}" class="${x.on ? "" : "off"}">
      <td class="n">${i + 1}</td>
      <td><input type="checkbox" data-f="on" ${x.on ? "checked" : ""}></td>
      <td><input data-f="key" class="w20 mono" value="${esc(x.key)}" placeholder="${K.D.header.prefix}XXX${K.D.header.postfix}"></td>
      <td><input data-f="value" class="w40 mono" value="${esc(x.value)}"></td>
      <td class="ops"><button data-op="up" title="上へ">↑</button><button data-op="down" title="下へ">↓</button><button data-op="ins" title="下に挿入">＋</button><button data-op="del" title="削除">✕</button></td>
    </tr>`).join("");
  $("hdrInfo").textContent = `有効な行のキーと値をそのままつないだ ${K.headerText(doc.header).length} バイトがヘッダになります`;
}
$("hdr").addEventListener("change", (e) => {
  const t = e.target, tr = t.closest("tr"); if (!tr) return;
  const x = doc.header[+tr.dataset.i];
  if (t.dataset.f === "on") x.on = t.checked; else x[t.dataset.f] = t.value;
  lastErr = null; renderHeader(); renderSlots(); renderSys(); renderMsgs();
});
$("hdr").addEventListener("click", (e) => {
  const op = e.target.dataset?.op; if (!op) return;
  const i = +e.target.closest("tr").dataset.i, H = doc.header;
  if (op === "up" && i > 0) [H[i - 1], H[i]] = [H[i], H[i - 1]];
  else if (op === "down" && i + 1 < H.length) [H[i + 1], H[i]] = [H[i], H[i + 1]];
  else if (op === "ins") H.splice(i + 1, 0, K.newHeaderRow());
  else if (op === "del") H.splice(i, 1);
  renderHeader(); renderSlots(); renderSys(); renderMsgs();
});
$("bHdrAdd").onclick = () => {
  const H = doc.header, endAt = H.findIndex((x) => x.key === K.D.header.end + K.D.header.postfix);
  H.splice(endAt < 0 ? H.length : endAt, 0, K.newHeaderRow());
  renderHeader(); renderMsgs();
};

// ---- syspage(中身は表示しない。読み込んだものを保持して出力する)
function renderSys() {
  const total = doc.syspage.reduce((a, x) => a + x.bytes.length, 0);
  if (!total) { $("sys").innerHTML = `<span class="muted">なし(0 バイト)</span>`; return; }
  const allOn = doc.syspage.every((x) => x.on);
  $("sys").innerHTML = `${total} バイト(読み込んだものをそのまま保持します。中身は表示しません) <label><input type="checkbox" id="sysOn" ${allOn ? "checked" : ""}> 出力する</label>`;
  $("sysOn").onchange = (e) => { for (const x of doc.syspage) x.on = e.target.checked; renderMsgs(); };
}

// ---- スロット
const structOpts = (v) => {
  let s = K.D.structs.map(([n, name]) => `<option value="${n}" ${n === v ? "selected" : ""}>${name}</option>`).join("");
  return s;
};
const classOpts = (v) => {
  let s = K.className(v) === null ? `<option value="${v}" selected>? (${v})</option>` : "";
  return s + K.D.classes.map((c) => `<option value="${c.value}" ${c.value === v ? "selected" : ""}>${c.name}</option>`).join("");
};
function eventOpts(cv, ev) {
  const c = K.classByVal.get(cv);
  const list = c ? c.events : [];
  const known = list.some(([v]) => v === ev);
  let s = known ? "" : `<option value="${ev}" selected>${esc(K.eventName(cv, ev) ?? "?")} (${ev})</option>`;
  return s + list.map(([v, n]) => `<option value="${v}" ${v === ev ? "selected" : ""}>${esc(n)}</option>`).join("");
}
const STR_TIP = "1 語のバイト列(ファイルのバイト順)。末尾の NUL は省略、\\xHH と \\\\ で任意のバイト";
function rowHtml(s, i, le) {
  const g = (f) => K.getF(s.h, f);
  const cv = g("class"), ev = g("event");
  const evLabel = K.eventName(cv, ev);
  return `<tr data-i="${i}" class="${s.on ? "" : "off"}">
    <td class="n">${i + 1}</td>
    <td><input type="checkbox" data-f="on" ${s.on ? "checked" : ""}></td>
    <td><input data-f="header" class="w10 mono" value="${K.hex8(s.h)}" title="ヘッダ語(16 進。0x 無しも 16 進)"></td>
    <td><input data-f="stamp" class="w10 mono" value="${K.hex8(s.stamp)}" title="時刻の下位 32bit(16 進。0x 無しも 16 進)"></td>
    <td><input data-f="d1x" class="w10 mono" value="${K.hex8(s.d1)}" title="16 進"></td>
    <td><input data-f="d2x" class="w10 mono" value="${K.hex8(s.d2)}" title="16 進"></td>
    <td><select data-f="struct">${structOpts(g("struct"))}</select></td>
    <td><input data-f="cpu" class="w3" value="${g("cpu")}"></td>
    <td><input data-f="flags" class="w4 mono" value="${K.hex2(g("flags"))}" title="16 進"></td>
    <td><div class="stack"><select data-f="className" class="cls">${classOpts(cv)}</select><input data-f="class" class="w3" value="${cv}"></div></td>
    <td><div class="stack"><select data-f="eventName" class="ev" data-lazy="1"><option value="${ev}" selected>${esc(evLabel ?? `? (${ev})`)}</option></select><input data-f="event" class="w4" value="${ev}"></div></td>
    <td><div class="stack"><input data-f="s1" class="w10 mono" value="${esc(K.wordToStr(s.d1, le))}" title="${STR_TIP}。${CONF.wordBytes} バイトを超えた分(${CONF.strBytes} バイトまで)は payload[1] に入ります"><input data-f="d1" class="w10" value="${s.d1}" title="10 進(負の数も可)"></div></td>
    <td><div class="stack"><input data-f="s2" class="w10 mono" value="${esc(K.wordToStr(s.d2, le))}" title="${STR_TIP}"><input data-f="d2" class="w10" value="${s.d2}" title="10 進(負の数も可)"></div></td>
    <td class="ops"><button data-op="ins" title="下に空の行を挿入">＋</button><button data-op="dup" title="下に複製">⧉</button><button data-op="del" title="削除">✕</button></td>
  </tr>`;
}
function pages() { return Math.max(1, Math.ceil(doc.slots.length / CONF.pageSize)); }
function renderPager() {
  const n = pages();
  const html = n <= 1 ? "" : `<button data-p="0">«</button><button data-p="${page - 1}">‹</button>
    <span>${page + 1} / ${n} ページ(${page * CONF.pageSize + 1}〜${Math.min(doc.slots.length, (page + 1) * CONF.pageSize)} 行)</span>
    <button data-p="${page + 1}">›</button><button data-p="${n - 1}">»</button>`;
  $("pagerTop").innerHTML = html; $("pagerBottom").innerHTML = html;
}
for (const id of ["pagerTop", "pagerBottom"]) {
  $(id).addEventListener("click", (e) => {
    const p = e.target.dataset?.p; if (p === undefined) return;
    page = Math.min(pages() - 1, Math.max(0, +p)); renderSlots();
  });
}
function renderSlots() {
  page = Math.min(page, pages() - 1);
  const le = K.littleEndian(doc.header);
  const a = page * CONF.pageSize, b = Math.min(doc.slots.length, a + CONF.pageSize);
  let html = "";
  for (let i = a; i < b; i++) html += rowHtml(doc.slots[i], i, le);
  $("slots").tBodies[0].innerHTML = html;
  renderPager();
}
function replaceRow(tr, i) {
  const t = document.createElement("tbody");
  t.innerHTML = rowHtml(doc.slots[i], i, K.littleEndian(doc.header));
  tr.replaceWith(t.firstElementChild);
}
const tbody = $("slots").tBodies[0];
// イベント名の一覧は選ぶときに作る(行ごとに数百の選択肢を持たない)
tbody.addEventListener("focusin", (e) => {
  const t = e.target;
  if (t.dataset?.lazy !== "1") return;
  const s = doc.slots[+t.closest("tr").dataset.i];
  t.innerHTML = eventOpts(K.getF(s.h, "class"), K.getF(s.h, "event"));
  t.dataset.lazy = "0";
});
tbody.addEventListener("change", (e) => {
  const t = e.target, tr = t.closest("tr"); if (!tr) return;
  const i = +tr.dataset.i, s = doc.slots[i], f = t.dataset.f;
  const le = K.littleEndian(doc.header);
  try {
    switch (f) {
      case "on": s.on = t.checked; s.fresh = false; break;
      case "struct": s.h = K.setF(s.h, "struct", +t.value); break;
      case "cpu": s.h = K.setF(s.h, "cpu", K.parseField(t.value, "cpu")); break;
      case "className": s.h = K.setF(s.h, "class", +t.value); break;
      case "class": s.h = K.setF(s.h, "class", K.parseField(t.value, "class")); break;
      case "eventName": s.h = K.setF(s.h, "event", +t.value); break;
      case "event": s.h = K.setF(s.h, "event", K.parseField(t.value, "event")); break;
      case "flags": s.h = K.setF(s.h, "flags", K.parseField(t.value, "flags", true)); break;
      case "header": s.h = K.parseU32(t.value, true); break;
      case "stamp": s.stamp = K.parseU32(t.value, true); break;
      case "d1": s.d1 = K.parseU32(t.value); break;
      case "d1x": s.d1 = K.parseU32(t.value, true); break;
      case "d2": s.d2 = K.parseU32(t.value); break;
      case "d2x": s.d2 = K.parseU32(t.value, true); break;
      case "s1": {
        const b = K.strToBytes(t.value, CONF.strBytes);
        const [w1, w2] = K.bytesToWords(b, le);
        s.d1 = w1;
        if (b.length > CONF.wordBytes) s.d2 = w2; // 4 バイトを超えた分は payload[1] へ
        break;
      }
      case "s2": s.d2 = K.bytesToWords(K.strToBytes(t.value, CONF.wordBytes), le)[0]; break;
      default: return;
    }
    if (s.fresh) { s.fresh = false; s.on = true; } // 新規の空行は、触ったら有効にする
    lastErr = null; opNote = null;
    replaceRow(tr, i);
    renderMsgs();
  } catch (err) {
    t.classList.add("bad"); t.title = err.message;
    setErr(`スロット ${i + 1} 行: ${err.message}`);
  }
});
tbody.addEventListener("click", (e) => {
  const op = e.target.dataset?.op; if (!op) return;
  const i = +e.target.closest("tr").dataset.i;
  if (op === "ins") doc.slots.splice(i + 1, 0, K.newSlot(true));
  else if (op === "dup") doc.slots.splice(i + 1, 0, { ...doc.slots[i], fresh: false });
  else if (op === "del") doc.slots.splice(i, 1);
  opNote = null;
  renderSlots(); renderMsgs();
});
$("bAddRows").textContent = `${CONF.addRows} 行を追加`;
$("bAddRows").onclick = () => {
  for (let i = 0; i < CONF.addRows; i++) doc.slots.push(K.newSlot(true));
  page = pages() - 1; renderSlots(); renderMsgs();
};

// ---- トレースバッファの補助
function renderBuffers(ana) {
  const bad = ana.bufs.filter((b) => b.issues.length);
  const list = [...bad, ...ana.bufs.filter((b) => !b.issues.length)];
  const shown = list.slice(0, CONF.maxBufferRows);
  const cpus = [...new Set(ana.bufs.map((b) => b.cpu))].sort((a, b) => a - b);
  let html = `<div class="muted">トレースバッファ ${ana.bufs.length} 個(CPU ${cpus.join(", ") || "なし"})・注意のあるトレースバッファ ${bad.length} 個。行を押すとそのスロットへ移動します</div>`;
  html += ana.issues.map(([i, m]) => `<div class="warn jump" data-row="${i}" style="cursor:pointer">${esc(m)}</div>`).join("");
  if (shown.length) {
    html += `<div class="wrap"><table><thead><tr><th>CPU</th><th>通番</th><th>BUFFER のスロット数</th><th>実際</th><th>行</th><th>注意</th></tr></thead><tbody>`;
    html += shown.map((b) => `<tr class="jump" data-row="${b.first}">
      <td>${b.cpu}</td><td>${b.seq}</td><td>${b.declared}</td>
      <td class="${b.closed && b.declared !== b.actual ? "bad" : ""}">${b.actual}</td>
      <td>${b.first + 1}〜${b.last + 1}</td><td class="bad">${esc(b.issues.join("、"))}</td></tr>`).join("");
    html += `</tbody></table></div>`;
    if (list.length > shown.length) html += `<div class="muted">ほか ${list.length - shown.length} 個は省略</div>`;
  }
  $("bufInfo").innerHTML = html;
}
function jumpTo(i) {
  page = Math.floor(i / CONF.pageSize);
  renderSlots();
  const tr = tbody.querySelector(`tr[data-i="${i}"]`);
  if (tr) { tr.scrollIntoView({ block: "center" }); tr.classList.add("hit"); }
}
$("bufInfo").addEventListener("click", (e) => {
  const el = e.target.closest("[data-row]");
  if (el) jumpTo(+el.dataset.row);
});
$("bAddBuf").onclick = () => {
  const r = K.addBuffer(doc.slots);
  opNote = ["info", `CPU ${r.cpu} の通番 ${r.seq} のトレースバッファを ${r.at + 1}〜${r.at + 3} 行に追加しました。` +
    "イベントは BUFFER と BUFFER_END の間に入れ(＋ボタンで挿入)、最後に「バッファ内スロット数修正」を押してください"];
  lastErr = null; renderMsgs(); jumpTo(r.at);
};
$("bFix").onclick = () => {
  const n = K.fixBufferCounts(doc.slots);
  opNote = ["info", n ? `BUFFER のスロット数を ${n} 個直しました` : "直す BUFFER はありませんでした"];
  lastErr = null; renderSlots(); renderMsgs();
};

// ---- 開く・保存
function renderAll() { renderHeader(); renderSys(); renderSlots(); renderMsgs(); }
async function openFile(f) {
  try {
    const isCsv = /\.csv$/i.test(f.name);
    doc = isCsv ? K.fromCsv(await f.text()) : K.parseKev(new Uint8Array(await f.arrayBuffer()));
    loadNotes = [["info", `${f.name} を読み込みました`], ...doc.notes];
    $("fname").value = f.name.replace(/\.(kev|csv)$/i, "");
    page = 0; lastErr = null; opNote = null; renderAll();
  } catch (err) {
    setErr(`${f.name}: ${err.message}`);
  }
}
$("bOpen").onclick = () => $("file").click();
$("file").onchange = (e) => { if (e.target.files[0]) openFile(e.target.files[0]); e.target.value = ""; };
document.addEventListener("dragover", (e) => { e.preventDefault(); document.body.classList.add("drop"); });
document.addEventListener("dragleave", () => document.body.classList.remove("drop"));
document.addEventListener("drop", (e) => {
  e.preventDefault(); document.body.classList.remove("drop");
  if (e.dataTransfer.files[0]) openFile(e.dataTransfer.files[0]);
});
$("bNew").onclick = () => { doc = K.newDoc(); loadNotes = []; lastErr = null; opNote = null; page = 0; $("fname").value = "edited"; renderAll(); };
function download(data, name, type) {
  const url = URL.createObjectURL(new Blob([data], { type }));
  const a = document.createElement("a"); a.href = url; a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
$("bSaveKev").onclick = () => {
  try { download(K.buildKev(doc), $("fname").value + ".kev", "application/octet-stream"); lastErr = null; renderMsgs(); }
  catch (err) { setErr(err.message); }
};
$("bSaveCsv").onclick = () => {
  // Excel で開けるように UTF-8 の BOM を付ける
  try { download("﻿" + K.toCsv(doc), $("fname").value + ".csv", "text/csv"); lastErr = null; renderMsgs(); }
  catch (err) { setErr(err.message); }
};

renderAll();
</script>
</body>
</html>
